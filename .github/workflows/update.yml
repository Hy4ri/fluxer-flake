name: Update Fluxer

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  update-fluxer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check for updates
        id: check
        run: |
          UPDATE_NEEDED=false

          for channel in stable canary; do
            LATEST=$(curl -s "https://api.fluxer.app/dl/desktop/$channel/linux/x64/latest" | jq -r '.version')
            CURRENT=$(jq -r ".$channel" version.json)

            echo "$channel: latest=$LATEST current=$CURRENT"

            if [ "$LATEST" != "$CURRENT" ] && [ "$LATEST" != "null" ] && [ -n "$LATEST" ]; then
              echo "New $channel version available: $LATEST"
              UPDATE_NEEDED=true
            fi
          done

          echo "update_needed=$UPDATE_NEEDED" >> $GITHUB_OUTPUT

      - name: Update Flake
        if: steps.check.outputs.update_needed == 'true'
        run: |
          chmod +x ./update-version.sh
          ./update-version.sh

      - name: Commit and Push
        if: steps.check.outputs.update_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json fluxer.nix fluxer-canary.nix
          git commit -m "chore: update fluxer versions" || echo "Nothing to commit"
          git push
