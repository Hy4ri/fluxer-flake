name: Update Fluxer

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  update-fluxer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      fail_reason: ${{ steps.check.outputs.fail_reason }}
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check for updates
        id: check
        continue-on-error: true
        run: |
          ERR_LOG="$(mktemp)"
          die() {
            echo "fail_reason=$1" | tr -d '\n\r' >> "$GITHUB_OUTPUT"
            echo "$1" >&2
            exit 1
          }
          # Harden the fetches: fail fast on connect, retry transient errors,
          # and capture the last error into ERR_LOG for the failure report.
          fetch_url() {
            curl -fsSL --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 3 --retry-all-errors "$1" 2>>"$ERR_LOG" || true
          }

          UPDATE_NEEDED=false

          for channel in stable canary; do
            LATEST=$(fetch_url "https://api.fluxer.app/dl/desktop/$channel/linux/x64/latest" | jq -r '.version' 2>/dev/null || true)
            CURRENT=$(jq -r ".$channel" version.json)

            if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
              die "Failed to fetch latest $channel version from api.fluxer.app. Last error: $(tail -n 1 "$ERR_LOG" 2>/dev/null || echo 'unknown')"
            fi

            echo "$channel: latest=$LATEST current=$CURRENT"

            if [ "$LATEST" != "$CURRENT" ] && [ "$LATEST" != "null" ] && [ -n "$LATEST" ]; then
              echo "New $channel version available: $LATEST"
              UPDATE_NEEDED=true
            fi
          done

          echo "fail_reason=" >> "$GITHUB_OUTPUT"
          echo "update_needed=$UPDATE_NEEDED" >> $GITHUB_OUTPUT

      - name: Update Flake
        if: steps.check.outputs.update_needed == 'true'
        run: |
          chmod +x ./update-version.sh
          ./update-version.sh

      - name: Commit and Push
        if: steps.check.outputs.update_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json fluxer.nix fluxer-canary.nix
          git commit -m "chore: update fluxer versions" || echo "Nothing to commit"
          git push

      - name: Close resolved failure issues
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABEL="auto-failure"
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --json number --jq '.[].number')
          for n in $OPEN; do
            echo "Closing auto-failure issue #$n (workflow succeeded again)"
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "The Update Fluxer workflow succeeded again — closing automatically."
          done

      # continue-on-error above would let the job pass; fail the run when the check failed.
      - name: Fail the run
        if: steps.check.outcome == 'failure'
        run: exit 1

  report-failure:
    runs-on: ubuntu-latest
    needs: update-fluxer
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Open failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABEL="auto-failure"
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

          REASON="${{ needs.update-fluxer.outputs.fail_reason }}"
          [ -n "$REASON" ] || REASON="See the failed run logs for details."

          TITLE="[auto] Update Fluxer workflow failed"
          BODY=$(printf 'The **Update Fluxer** workflow failed on %s.\n\n- Run: %s/%s/actions/runs/%s\n- Job: update-fluxer\n\n**Failure reason:** %s\n\n_This issue was created automatically. It will be closed automatically when the workflow succeeds again._\n' "$(date -u +'%Y-%m-%d %H:%M UTC')" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$REASON")

          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Failure issue #$EXISTING already open — adding comment instead."
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Still failing on run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — $REASON"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label "$LABEL" --body "$BODY"
          fi
